<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYAA Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Login View -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-200">
            <div class="text-center mb-6">
                <img src="logo.jpg" alt="RYAA Logo" class="h-16 w-16 mx-auto rounded-full object-cover mb-2" onerror="this.src='https://via.placeholder.com/60/115e39/ffffff?text=RYAA'">
                <h1 class="text-2xl font-black text-gray-900">RYAA ADMIN</h1>
                <p class="text-xs text-gray-500 mt-1">Sign in to manage website content</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold py-3 rounded uppercase text-sm tracking-wider shadow transition">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard View (Protected) -->
    <div id="dashboard-view" class="hidden min-h-screen flex flex-col">
        <!-- Admin Header -->
        <header class="bg-emerald-900 text-white px-6 py-4 flex justify-between items-center shadow">
            <div class="flex items-center space-x-3">
                <span class="font-black text-xl tracking-wider text-amber-400">RYAA DASHBOARD</span>
            </div>
            <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded uppercase tracking-wider transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </button>
        </header>

        <!-- Admin Content -->
        <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full space-y-8">
            
            <!-- Section 1: Add Recent Work / Activity -->
            <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
                <h2 class="text-lg font-black text-gray-900 mb-4 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-emerald-700"></i> Add New Activity / Work
                </h2>
                
                <form id="add-work-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Title *</label>
                        <input type="text" id="work-title" required placeholder="Event or activity title" class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm">
                    </div>

                    <!-- Department Category Selector (আপডেট করা নতুন ড্রপডাউন) -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Department / Category *</label>
                        <select id="work-category" required class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm bg-white">
                            <option value="">Select Department</option>
                            <option value="Foreign Affairs">1. Foreign Affairs</option>
                            <option value="Programme">2. Programme</option>
                            <option value="Finance">3. Finance</option>
                            <option value="Community Engagement">4. Community Engagement</option>
                            <option value="Education">5. Education</option>
                            <option value="Youth Empowerment">6. Youth Empowerment</option>
                            <option value="Culture">7. Culture</option>
                            <option value="Refugee Affairs">8. Refugee Affairs</option>
                            <option value="Media">9. Media</option>
                            <option value="Environment">10. Environment</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Image URL(s) *</label>
                        <input type="text" id="work-image" required placeholder="https://image-link.com/pic1.jpg, https://image-link.com/pic2.jpg" class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm">
                        <p class="text-[11px] text-gray-500 mt-1">কমা (,) দিয়ে আলাদা করে একাধিক ছবির লিঙ্ক বসাতে পারবেন।</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Description *</label>
                        <textarea id="work-desc" rows="3" required placeholder="Write activity details..." class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-amber-400 focus:outline-none text-sm"></textarea>
                    </div>

                    <button type="submit" id="add-work-btn" class="bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold py-2.5 px-6 rounded uppercase text-xs tracking-wider shadow transition">
                        Publish Activity
                    </button>
                </form>
            </div>

            <!-- Section 2: Manage Existing Works -->
            <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
                <h2 class="text-lg font-black text-gray-900 mb-4 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-emerald-700"></i> Manage Published Activities
                </h2>
                <div id="admin-works-list" class="space-y-4">
                    <p class="text-gray-500 text-sm">Loading activities...</p>
                </div>
            </div>

            <!-- Section 3: Volunteer Applications List -->
            <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
                <h2 class="text-lg font-black text-gray-900 mb-4 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-users text-emerald-700"></i> Volunteer Applications
                </h2>
                <div id="volunteers-list" class="space-y-3">
                    <p class="text-gray-500 text-sm">Loading applications...</p>
                </div>
            </div>

            <!-- Section 4: Donation Requests List -->
            <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
                <h2 class="text-lg font-black text-gray-900 mb-4 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-hand-holding-dollar text-emerald-700"></i> Donation Requests
                </h2>
                <div id="donations-list" class="space-y-3">
                    <p class="text-gray-500 text-sm">Loading donations...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmBhhZIxWN3GubuzM8VCL8tKX0F2JN2m8",
            authDomain: "ryaa-digital-hub.firebaseapp.com",
            projectId: "ryaa-digital-hub",
            storageBucket: "ryaa-digital-hub.firebasestorage.app",
            messagingSenderId: "672127865081",
            appId: "1:672127865081:web:fd6dc8783e6bd848e55228"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Authentication State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                loadWorks();
                loadVolunteers();
                loadDonations();
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('hidden');
            }
        });

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert("Login Failed: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        });

        // Logout Handler
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Add Activity / Work
        document.getElementById('add-work-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('add-work-btn');
            btn.disabled = true;
            btn.innerText = "Publishing...";

            try {
                await addDoc(collection(db, "works"), {
                    title: document.getElementById('work-title').value,
                    category: document.getElementById('work-category').value,
                    image: document.getElementById('work-image').value,
                    description: document.getElementById('work-desc').value,
                    createdAt: serverTimestamp()
                });

                document.getElementById('add-work-form').reset();
                alert("Activity published successfully!");
            } catch (err) {
                alert("Error adding activity: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish Activity";
            }
        });

        // Delete Work
        window.deleteWork = async (id) => {
            if (confirm("Are you sure you want to delete this activity?")) {
                try {
                    await deleteDoc(doc(db, "works", id));
                } catch (err) {
                    alert("Delete failed: " + err.message);
                }
            }
        };

        // Load Published Works
        function loadWorks() {
            const list = document.getElementById('admin-works-list');
            const q = query(collection(db, "works"));

            onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if (snapshot.docs.length === 0) {
                    list.innerHTML = `<p class="text-gray-500 text-sm">No published activities found.</p>`;
                    return;
                }

                snapshot.docs.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    list.innerHTML += `
                        <div class="border border-gray-200 p-4 rounded-lg flex justify-between items-start bg-gray-50">
                            <div>
                                <span class="text-xs font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded">${data.category || 'General'}</span>
                                <h4 class="font-bold text-gray-900 mt-1">${data.title}</h4>
                                <p class="text-xs text-gray-600 mt-1">${data.description}</p>
                            </div>
                            <button onclick="deleteWork('${id}')" class="text-red-600 hover:text-red-800 text-sm font-bold ml-4">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
            });
        }

        // Load Volunteer Requests
        function loadVolunteers() {
            const list = document.getElementById('volunteers-list');
            const q = query(collection(db, "volunteers"));

            onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if (snapshot.docs.length === 0) {
                    list.innerHTML = `<p class="text-gray-500 text-sm">No volunteer applications received yet.</p>`;
                    return;
                }

                snapshot.docs.forEach((docSnap) => {
                    const v = docSnap.data();
                    list.innerHTML += `
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50 text-xs text-gray-700 space-y-1">
                            <div class="flex justify-between font-bold text-gray-900 text-sm">
                                <span>${v.name} (${v.department})</span>
                                <span class="text-emerald-700">${v.phone}</span>
                            </div>
                            <p><strong>Email:</strong> ${v.email} | <strong>Location:</strong> ${v.location}</p>
                            ${v.skills ? `<p><strong>Skills:</strong> ${v.skills}</p>` : ''}
                        </div>
                    `;
                });
            });
        }

        // Load Donation Requests
        function loadDonations() {
            const list = document.getElementById('donations-list');
            const q = query(collection(db, "donations"));

            onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if (snapshot.docs.length === 0) {
                    list.innerHTML = `<p class="text-gray-500 text-sm">No donation requests received yet.</p>`;
                    return;
                }

                snapshot.docs.forEach((docSnap) => {
                    const d = docSnap.data();
                    list.innerHTML += `
                        <div class="border border-gray-200 p-3 rounded-lg bg-gray-50 text-xs text-gray-700 space-y-1">
                            <div class="flex justify-between font-bold text-gray-900 text-sm">
                                <span>${d.name}</span>
                                <span class="text-amber-600 font-extrabold">${d.amount} ${d.currency}</span>
                            </div>
                            <p><strong>Phone:</strong> ${d.phone} | <strong>Email:</strong> ${d.email}</p>
                            <p><strong>Method:</strong> ${d.paymentMethod}</p>
                            ${d.message ? `<p><strong>Message:</strong> ${d.message}</p>` : ''}
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
