<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYAA Admin Panel</title>
    <style>
        :root {
            --primary-green: #115e39;
            --light-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light-bg);
            color: var(--text-light);
            padding: 20px;
            line-height: 1.5;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: var(--accent-orange);
            font-size: 1.8rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin-bottom: 15px;
            color: var(--accent-orange);
            font-size: 1.2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .item-list {
            margin-top: 15px;
        }
        .item-row {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h4 {
            font-size: 1rem;
            color: white;
        }
        .item-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>RYAA Admin Panel</h1>
        </div>

        <!-- Add / Edit Work -->
        <div class="card">
            <h3 id="form-heading">Add New Work / Event</h3>
            <form id="work-form">
                <input type="hidden" id="edit-work-id">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="work-title" required placeholder="e.g. Community Engagement Program">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="work-category" required placeholder="e.g. Social Work">
                </div>
                <div class="form-group">
                    <label>Image URLs (One URL per line for multiple images)</label>
                    <textarea id="work-image" placeholder="Paste image links here (each on a new line)"></textarea>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="work-desc" placeholder="Write description..."></textarea>
                </div>
                <div class="form-group">
                    <label>External Link (Optional)</label>
                    <input type="url" id="work-link" placeholder="https://...">
                </div>
                <button type="submit" id="work-submit-btn">Publish Work</button>
            </form>
        </div>

        <!-- Manage Existing Works -->
        <div class="card">
            <h3>Manage Existing Works</h3>
            <div id="works-list" class="item-list">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Loading works...</p>
            </div>
        </div>

        <!-- Add Leadership Member -->
        <div class="card">
            <h3>Add Leadership Member</h3>
            <form id="team-form">
                <div class="form-group">
                    <label>Member Name</label>
                    <input type="text" id="team-name" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Role / Position</label>
                    <input type="text" id="team-role" required placeholder="e.g. President / Director">
                </div>
                <div class="form-group">
                    <label>Short Bio (Optional)</label>
                    <textarea id="team-bio" placeholder="Brief info about member..."></textarea>
                </div>
                <button type="submit">Add Member</button>
            </form>
        </div>

        <!-- Manage Leadership Team -->
        <div class="card">
            <h3>Manage Leadership Team</h3>
            <div id="team-list" class="item-list">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Loading team members...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmBhhZIxWN3GubuzM8VCL8tKX0F2JN2m8",
            authDomain: "ryaa-digital-hub.firebaseapp.com",
            projectId: "ryaa-digital-hub",
            storageBucket: "ryaa-digital-hub.firebasestorage.app",
            messagingSenderId: "672127865081",
            appId: "1:672127865081:web:fd6dc8783e6bd848e55228"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load Existing Works
        async function loadExistingWorks() {
            const worksListDiv = document.getElementById('works-list');
            try {
                const querySnapshot = await getDocs(collection(db, "works"));
                if (querySnapshot.empty) {
                    worksListDiv.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No works found.</p>';
                    return;
                }
                worksListDiv.innerHTML = '';
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const workId = documentSnap.id;

                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <div class="item-info">
                            <span style="font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; color: #f97316;">${data.category || ''}</span>
                            <h4 style="margin-top: 4px;">${data.title}</h4>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button class="btn-edit-work" data-id="${workId}" style="background: #3b82f6; color: white; border: none; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer;">Edit</button>
                            <button class="btn-delete-work" data-id="${workId}" style="background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer;">Delete</button>
                        </div>
                    `;
                    worksListDiv.appendChild(row);
                });

                // Delete Work
                document.querySelectorAll('.btn-delete-work').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm('Are you sure you want to delete this work?')) {
                            try {
                                await deleteDoc(doc(db, "works", id));
                                alert('Work deleted successfully!');
                                loadExistingWorks();
                            } catch (err) {
                                alert('Failed to delete: ' + err.message);
                            }
                        }
                    });
                });

                // Edit Work
                document.querySelectorAll('.btn-edit-work').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        const querySnapshot = await getDocs(collection(db, "works"));
                        querySnapshot.forEach((documentSnap) => {
                            if (documentSnap.id === id) {
                                const data = documentSnap.data();
                                document.getElementById('edit-work-id').value = id;
                                document.getElementById('work-title').value = data.title || '';
                                document.getElementById('work-category').value = data.category || '';
                                
                                if (Array.isArray(data.image)) {
                                    document.getElementById('work-image').value = data.image.join('\n');
                                } else {
                                    document.getElementById('work-image').value = data.image || '';
                                }

                                document.getElementById('work-desc').value = data.description || '';
                                document.getElementById('work-link').value = data.link || '';

                                document.getElementById('form-heading').innerText = 'Edit Work / Event';
                                document.getElementById('work-submit-btn').innerText = 'Update Work';
                                window.scrollTo({ top: 0, behavior: 'smooth' });
                            }
                        });
                    });
                });

            } catch (err) {
                worksListDiv.innerHTML = '<p style="color: var(--accent-red);">Failed to load works.</p>';
            }
        }

        // Handle Work Form Submit (Add / Update)
        document.getElementById('work-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-work-id').value;
            const title = document.getElementById('work-title').value;
            const category = document.getElementById('work-category').value;
            const imageRaw = document.getElementById('work-image').value;
            const description = document.getElementById('work-desc').value;
            const link = document.getElementById('work-link').value;

            const images = imageRaw.split('\n').map(url => url.trim()).filter(url => url.length > 0);
            const imagePayload = images.length > 1 ? images : (images[0] || '');

            try {
                if (editId) {
                    await updateDoc(doc(db, "works", editId), {
                        title,
                        category,
                        image: imagePayload,
                        description,
                        link
                    });
                    alert('Work updated successfully!');
                } else {
                    await addDoc(collection(db, "works"), {
                        title,
                        category,
                        image: imagePayload,
                        description,
                        link,
                        createdAt: new Date()
                    });
                    alert('Work published successfully!');
                }
                document.getElementById('work-form').reset();
                document.getElementById('edit-work-id').value = '';
                document.getElementById('form-heading').innerText = 'Add New Work / Event';
                document.getElementById('work-submit-btn').innerText = 'Publish Work';
                loadExistingWorks();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // Add Leadership Member
        document.getElementById('team-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('team-name').value;
            const role = document.getElementById('team-role').value;
            const bio = document.getElementById('team-bio').value;

            try {
                await addDoc(collection(db, "team"), {
                    name,
                    role,
                    bio
                });
                alert('Team member added successfully!');
                document.getElementById('team-form').reset();
                loadTeamMembers();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // Load Leadership Members
        async function loadTeamMembers() {
            const teamListDiv = document.getElementById('team-list');
            try {
                const querySnapshot = await getDocs(collection(db, "team"));
                if (querySnapshot.empty) {
                    teamListDiv.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No team members found.</p>';
                    return;
                }
                teamListDiv.innerHTML = '';
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const memberId = documentSnap.id;

                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <div class="item-info">
                            <h4>${data.name}</h4>
                            <p>${data.role}</p>
                        </div>
                        <button class="btn-delete-team" data-id="${memberId}" style="background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer;">Delete</button>
                    `;
                    teamListDiv.appendChild(row);
                });

                // Delete Team Member
                document.querySelectorAll('.btn-delete-team').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm('Are you sure you want to delete this member?')) {
                            try {
                                await deleteDoc(doc(db, "team", id));
                                alert('Member deleted successfully!');
                                loadTeamMembers();
                            } catch (err) {
                                alert('Failed to delete: ' + err.message);
                            }
                        }
                    });
                });

            } catch (err) {
                teamListDiv.innerHTML = '<p style="color: var(--accent-red);">Failed to load team members.</p>';
            }
        }

        // Initialize
        loadExistingWorks();
        loadTeamMembers();
    </script>
</body>
</html>
