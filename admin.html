<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RYAA Digital Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

    <!-- Login Section -->
    <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-bold text-orange-500 mb-2 text-center">Admin Portal</h2>
            <p class="text-slate-400 text-sm mb-6 text-center">Login to manage RYAA Digital Hub</p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Email</label>
                    <input type="email" id="admin-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="admin-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-semibold py-2.5 rounded-lg transition">Login</button>
                <p id="login-error" class="text-red-500 text-xs text-center mt-2"></p>
            </form>
            <div class="text-center mt-6">
                <a href="index.html" class="text-xs text-slate-500 hover:text-slate-400">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by Default) -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <nav class="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex justify-between items-center">
            <h1 class="font-bold text-orange-500 text-lg">RYAA Admin Panel</h1>
            <div class="flex items-center gap-4">
                <a href="index.html" target="_blank" class="text-xs text-slate-400 hover:text-white">Visit Site</a>
                <button id="logout-btn" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded hover:bg-red-600 hover:text-white transition">Logout</button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4 py-8 w-full space-y-12">
            
            <!-- Add / Edit Work Form -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                <h3 id="form-title" class="text-lg font-bold text-orange-400 mb-4">Add Work / Project</h3>
                <form id="work-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="hidden" id="edit-work-id">
                    <input type="text" id="work-title" placeholder="Project Title" required class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-orange-500">
                    <input type="text" id="work-category" placeholder="Category Name" required class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-orange-500">
                    
                    <div class="flex flex-col sm:col-span-2">
                        <label class="text-xs text-slate-400 mb-1">Project Image URL (ImgBB Direct Link)</label>
                        <input type="url" id="work-image-url" placeholder="https://i.ibb.co/.../image.jpg" required class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-orange-500">
                    </div>

                    <input type="text" id="work-link" placeholder="Project Link (Optional)" class="sm:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-orange-500">
                    <textarea id="work-desc" placeholder="Short Description" rows="2" class="sm:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-orange-500"></textarea>
                    
                    <div class="sm:col-span-2 flex gap-4">
                        <button type="submit" id="work-submit-btn" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white py-2.5 rounded-lg text-sm font-semibold transition">Publish Work</button>
                        <button type="button" id="cancel-edit-btn" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 py-2.5 rounded-lg text-sm font-semibold transition">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Manage Existing Works -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                <h3 class="text-lg font-bold text-orange-400 mb-4">Manage Existing Works</h3>
                <div id="admin-works-list" class="space-y-4">
                    <p class="text-slate-500 text-sm">Loading works...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Admin Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmBhhZIxWN3GubuzM8VCL8tKX0F2JN2m8",
            authDomain: "ryaa-digital-hub.firebaseapp.com",
            projectId: "ryaa-digital-hub",
            storageBucket: "ryaa-digital-hub.firebasestorage.app",
            messagingSenderId: "672127865081",
            appId: "1:672127865081:web:fd6dc8783e6bd848e55228"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                fetchAdminWorks();
            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            loginError.textContent = '';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = error.message;
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Fetch Works in Admin Panel for Edit/Delete
        async function fetchAdminWorks() {
            const listContainer = document.getElementById('admin-works-list');
            try {
                const querySnapshot = await getDocs(collection(db, "works"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-slate-500 text-sm">No works found.</p>';
                    return;
                }
                listContainer.innerHTML = '';
                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const id = documentSnapshot.id;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-slate-950 border border-slate-800 p-4 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4';
                    itemDiv.innerHTML = `
                        <div>
                            <span class="text-xs text-orange-400 font-semibold">${data.category || ''}</span>
                            <h4 class="font-bold text-slate-200">${data.title}</h4>
                            <p class="text-xs text-slate-400 line-clamp-1">${data.description || ''}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <button data-id="${id}" class="edit-btn bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded text-xs hover:bg-blue-600 hover:text-white transition">Edit</button>
                            <button data-id="${id}" class="delete-btn bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1 rounded text-xs hover:bg-red-600 hover:text-white transition">Delete</button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });

                // Attach Delete Event
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm('Are you sure you want to delete this work?')) {
                            try {
                                await deleteDoc(doc(db, "works", id));
                                alert('Work deleted successfully!');
                                fetchAdminWorks();
                            } catch (err) {
                                alert('Error deleting: ' + err.message);
                            }
                        }
                    });
                });

                // Attach Edit Event
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.target.getAttribute('data-id');
                        const docSnap = querySnapshot.docs.find(d => d.id === id);
                        if (docSnap) {
                            const data = docSnap.data();
                            document.getElementById('edit-work-id').value = id;
                            document.getElementById('work-title').value = data.title || '';
                            document.getElementById('work-category').value = data.category || '';
                            document.getElementById('work-image-url').value = data.image || '';
                            document.getElementById('work-link').value = data.link || '';
                            document.getElementById('work-desc').value = data.description || '';
                            
                            document.getElementById('form-title').textContent = 'Edit Work / Project';
                            document.getElementById('work-submit-btn').textContent = 'Update Work';
                            document.getElementById('cancel-edit-btn').classList.remove('hidden');
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    });
                });

            } catch (err) {
                listContainer.innerHTML = '<p class="text-red-500 text-sm">Failed to load works.</p>';
            }
        }

        // Cancel Edit Mode
        document.getElementById('cancel-edit-btn').addEventListener('click', () => {
            document.getElementById('work-form').reset();
            document.getElementById('edit-work-id').value = '';
            document.getElementById('form-title').textContent = 'Add Work / Project';
            document.getElementById('work-submit-btn').textContent = 'Publish Work';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        });

        // Add or Update Work Handler
        document.getElementById('work-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-work-id').value;
            const title = document.getElementById('work-title').value;
            const category = document.getElementById('work-category').value;
            const imageUrl = document.getElementById('work-image-url').value;
            const link = document.getElementById('work-link').value;
            const description = document.getElementById('work-desc').value;
            const submitBtn = document.getElementById('work-submit-btn');

            try {
                submitBtn.textContent = editId ? 'Updating...' : 'Publishing...';
                submitBtn.disabled = true;

                if (editId) {
                    // Update existing document
                    await updateDoc(doc(db, "works", editId), {
                        title,
                        category,
                        image: imageUrl,
                        link,
                        description
                    });
                    alert('Work updated successfully!');
                } else {
                    // Add new document
                    await addDoc(collection(db, "works"), { 
                        title, 
                        category, 
                        image: imageUrl, 
                        link, 
                        description,
                        createdAt: Date.now()
                    });
                    alert('Work published successfully!');
                }

                document.getElementById('work-form').reset();
                document.getElementById('edit-work-id').value = '';
                document.getElementById('form-title').textContent = 'Add Work / Project';
                document.getElementById('work-submit-btn').textContent = 'Publish Work';
                document.getElementById('cancel-edit-btn').classList.add('hidden');
                fetchAdminWorks();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                submitBtn.textContent = editId ? 'Update Work' : 'Publish Work';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
